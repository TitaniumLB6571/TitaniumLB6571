<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="340" viewBox="0 0 1000 340" role="img" aria-labelledby="title desc">
<title id="title">TitaniumLB — build, automate, repeat</title>
<desc id="desc">Neon terminal banner with cycling automation, geospatial, AI and Minecraft messages, an orbiting signal and a blinking cursor.</desc>
<defs>
<linearGradient id="edge" x2="1" y2="1"><stop stop-color="#22d3ee"/><stop offset=".5" stop-color="#a78bfa"/><stop offset="1" stop-color="#f472b6"/></linearGradient>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M 40 0 L 0 0 0 40" fill="none" stroke="#64748b" stroke-opacity=".12"/></pattern>
<radialGradient id="halo"><stop stop-color="#7c3aed" stop-opacity=".3"/><stop offset="1" stop-color="#0b1020" stop-opacity="0"/></radialGradient>
</defs>
<rect x="2" y="2" width="996" height="336" rx="20" fill="#0b1020" stroke="url(#edge)" stroke-width="2"/>
<rect x="3" y="3" width="994" height="334" rx="20" fill="url(#grid)"/>
<ellipse cx="800" cy="180" rx="195" ry="150" fill="url(#halo)"/>
<path d="M 24 48 H 976" stroke="#253047"/>
<circle cx="28" cy="26" r="5" fill="#fb7185"/><circle cx="47" cy="26" r="5" fill="#fbbf24"/><circle cx="66" cy="26" r="5" fill="#34d399"/>
<text x="92" y="31" fill="#94a3b8" font-family="monospace" font-size="12">titaniumlb ~ / workshop</text>
<g font-family="monospace">
<text x="48" y="95" fill="#22d3ee" font-size="15">$ whoami</text>
<text x="46" y="157" fill="#f8fafc" font-weight="700" font-size="56" letter-spacing="2">TitaniumLB</text>
<text x="49" y="192" fill="#c4b5fd" font-size="17">BUILD. AUTOMATE. REPEAT.</text>
<text x="49" y="237" fill="#34d399" font-size="16">&gt;</text>
<g fill="#e2e8f0" font-size="16">
<text x="73" y="237" opacity="1">Automating the repetitive stuff.<animate attributeName="opacity" values="1;0;0;0;1" keyTimes="0;.25;.5;.75;1" dur="16s" calcMode="discrete" repeatCount="indefinite"/></text>
<text x="73" y="237" opacity="0">Turning maps into useful tools.<animate attributeName="opacity" values="0;1;0;0;0" keyTimes="0;.25;.5;.75;1" dur="16s" calcMode="discrete" repeatCount="indefinite"/></text>
<text x="73" y="237" opacity="0">Putting AI to work.<animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0;.25;.5;.75;1" dur="16s" calcMode="discrete" repeatCount="indefinite"/></text>
<text x="73" y="237" opacity="0">From PocketMine to real-world pipelines.<animate attributeName="opacity" values="0;0;0;1;0" keyTimes="0;.25;.5;.75;1" dur="16s" calcMode="discrete" repeatCount="indefinite"/></text>
</g>
<text x="49" y="291" fill="#64748b" font-size="13">PHP / PYTHON / VUE / C# / QGIS</text>
<rect x="49" y="307" width="9" height="3" fill="#22d3ee"><animate attributeName="opacity" values="1;0;1" dur="1.2s" repeatCount="indefinite"/></rect>
</g>
<g transform="translate(825 175)" fill="none">
<circle r="73" stroke="#a78bfa" stroke-opacity=".25"/>
<ellipse rx="95" ry="36" transform="rotate(-35)" stroke="#22d3ee" stroke-opacity=".5"/>
<ellipse rx="95" ry="36" transform="rotate(35)" stroke="#f472b6" stroke-opacity=".5"/>
<path d="M-24-17 -43 0 -24 17 M24-17 43 0 24 17 M10-27 -10 27" stroke="#e2e8f0" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<g><circle cx="73" r="5" fill="#22d3ee"/><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="12s" repeatCount="indefinite"/></g>
<g><circle cx="-73" r="4" fill="#f472b6"/><animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="18s" repeatCount="indefinite"/></g>
<circle r="87" stroke="#a78bfa" stroke-dasharray="3 16" stroke-opacity=".35"/>
</g>
</svg>
