<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="482" viewBox="0 0 1000 482" role="img" aria-label="The workshop: automation, geospatial, applied AI, web and APIs, Minecraft"><defs><linearGradient id="neon"><stop stop-color="#22d3ee"/><stop offset=".5" stop-color="#a78bfa"/><stop offset="1" stop-color="#f472b6"/></linearGradient><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#94a3b8" stroke-opacity=".07"/></pattern></defs><rect x="1" y="1" width="998" height="480" rx="16" fill="#0b1020" stroke="#334155"/><rect x="2" y="2" width="996" height="478" rx="16" fill="url(#grid)"/><g font-family="monospace"><text x="28" y="40" fill="#22d3ee" font-size="14">01 /</text><text x="90" y="40" fill="#f8fafc" font-size="22" font-weight="bold">THE WORKSHOP</text><path d="M28 58H972" stroke="url(#neon)" stroke-opacity=".4"/><path d="M28 58H972" stroke="#22d3ee" stroke-width="2" stroke-dasharray="60 884"><animate attributeName="stroke-dashoffset" from="944" to="-944" dur="14s" repeatCount="indefinite"/></path><g transform="translate(28 80)"><rect width="464" height="112" rx="10" fill="#111a2d" stroke="#22d3ee" stroke-opacity=".35"/><rect x="0" y="16" width="3" height="30" rx="1" fill="#22d3ee"><animate attributeName="height" values="30;62;30" dur="5s" repeatCount="indefinite"/></rect><circle cx="439" cy="22" r="4" fill="#22d3ee"><animate attributeName="opacity" values=".35;1;.35" dur="3s" repeatCount="indefinite"/></circle><text x="20" y="31" fill="#22d3ee" font-size="17" font-weight="bold">AUTOMATION</text><text x="20" y="62" fill="#e2e8f0" font-size="14">Internal tools and pipelines.</text><text x="20" y="85" fill="#94a3b8" font-size="14">Less manual work. More building.</text></g><g transform="translate(508 80)"><rect width="464" height="112" rx="10" fill="#111a2d" stroke="#34d399" stroke-opacity=".35"/><rect x="0" y="16" width="3" height="30" rx="1" fill="#34d399"><animate attributeName="height" values="30;62;30" dur="6s" repeatCount="indefinite"/></rect><circle cx="439" cy="22" r="4" fill="#34d399"><animate attributeName="opacity" values=".35;1;.35" dur="3.5s" repeatCount="indefinite"/></circle><text x="20" y="31" fill="#34d399" font-size="17" font-weight="bold">GEOSPATIAL</text><text x="20" y="62" fill="#e2e8f0" font-size="14">QGIS, parcels, street-level data.</text><text x="20" y="85" fill="#94a3b8" font-size="14">Maps that help make decisions.</text></g><g transform="translate(28 210)"><rect width="464" height="112" rx="10" fill="#111a2d" stroke="#a78bfa" stroke-opacity=".35"/><rect x="0" y="16" width="3" height="30" rx="1" fill="#a78bfa"><animate attributeName="height" values="30;62;30" dur="7s" repeatCount="indefinite"/></rect><circle cx="439" cy="22" r="4" fill="#a78bfa"><animate attributeName="opacity" values=".35;1;.35" dur="4s" repeatCount="indefinite"/></circle><text x="20" y="31" fill="#a78bfa" font-size="17" font-weight="bold">APPLIED AI</text><text x="20" y="62" fill="#e2e8f0" font-size="14">Structured data + vision + models.</text><text x="20" y="85" fill="#94a3b8" font-size="14">Useful helpers for real workflows.</text></g><g transform="translate(508 210)"><rect width="464" height="112" rx="10" fill="#111a2d" stroke="#f472b6" stroke-opacity=".35"/><rect x="0" y="16" width="3" height="30" rx="1" fill="#f472b6"><animate attributeName="height" values="30;62;30" dur="8s" repeatCount="indefinite"/></rect><circle cx="439" cy="22" r="4" fill="#f472b6"><animate attributeName="opacity" values=".35;1;.35" dur="4.5s" repeatCount="indefinite"/></circle><text x="20" y="31" fill="#f472b6" font-size="17" font-weight="bold">WEB &amp; APIs</text><text x="20" y="62" fill="#e2e8f0" font-size="14">Web tools and integrations.</text><text x="20" y="85" fill="#94a3b8" font-size="14">From idea to working prototype.</text></g><g transform="translate(28 340)"><rect width="464" height="112" rx="10" fill="#111a2d" stroke="#fbbf24" stroke-opacity=".35"/><rect x="0" y="16" width